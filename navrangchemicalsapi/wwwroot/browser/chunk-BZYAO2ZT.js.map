
<form [formGroup]="semiFinishedForm" (ngSubmit)="onSubmit()" (ngSubmit)="onCancel()">
  <div class="card-body row" style="gap: 0">
    <!-- Product Name -->
    <div class="form-group row">
      <label for="userName" class="col-sm-3 col-form-label">
        <i class="fas fa-user"></i> Raw Material Name
      </label>
      <div class="col-sm-9">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            id="userName"
            placeholder="Enter product name"
            formControlName="name"
          />
        </div>
      </div>
    </div>
    <!-- Product Price -->
    <div class="form-group row">
      <label for="mobileNo" class="col-sm-3 col-form-label">
        <i class="fas fa-phone"></i> Raw Material Price
      </label>
      <div class="col-sm-9">
        <div class="input-group">
          <input
            type="number"
            class="form-control"
            id="mobileNo"
            placeholder="Enter Price"
            formControlName="price"
          />
        </div>
      </div>
    </div>    
  </div>

  <div class="card-footer d-flex justify-content-between align-items-center">
    <button type="submit" class="btn btn-info mb-0">
      <i class="fas fa-save"></i> Update Product
    </button>
    <button (click)="onCancel()" class="btn btn-danger ms-auto">
      <i class="fas fa-times"></i> Cancel
    </button>
  </div>
</form>
