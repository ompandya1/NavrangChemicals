<div class="wrapper">
  <div class="main-content">
    <section class="content-header">
      <div class="container-fluid">
        <h3>Users</h3>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">
        <div class="card">
          <div
            class="card-header d-flex justify-content-between align-items-center"
          >
            <h3 class="card-title mb-0">Details</h3>
            <button class="btn btn-primary ms-auto" routerLink="/add-user">
              Add a new user
            </button>
          </div>

          <div class="card-body">
            <input
              type="text"
              class="form-control mb-3"
              placeholder="Search..."
              [(ngModel)]="searchTerm"
            />

            <table
              class="table table-bordered table-hover"
              style="text-align: center"
            >
              <thead>
                <tr>
                  <th>Sr.No.</th>
                  <th>Full Name</th>
                  <th>Mobile</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Requested Date</th>
                  <th>status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let user of filteredUsers(); let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ user.fullName || user.username }} </td>
                  <td>{{ user.phone }}</td>
                  <td>{{ user.email }}</td>
                  <td>{{ user.role }}</td>
                  <td>{{ user.requestedDate | date : "short" }}</td>
                  <!-- Status Column -->
                  <td>
                    <span
                      class="badge"
                      [ngClass]="{
                        'bg-success': user.status === 'Active',
                        'bg-warning': user.status === 'Pending',
                        'bg-danger': user.status === 'Rejected',
                        'bg-info': user.status === 'Inactive'
                      }"
                    >
                      {{ user.status }}
                    </span>
                  </td>

                  <!-- Actions Column -->
                  <td>
                    <ng-container [ngSwitch]="user.status">
                      <!-- If Active -->
                      <button
                        *ngSwitchCase="'Active'"
                        class="btn btn-outline-danger btn-sm"
                        (click)="handleStatus(user.id, 'deactivate')"
                      >
                        <i class="fa fa-ban"></i> Deactivate
                      </button>

                      <!-- If Pending -->
                      <ng-container *ngSwitchCase="'Pending'">
                        <button
                          class="btn btn-outline-success btn-sm me-1"
                          (click)="handleStatus(user.id, 'accept')"
                        >
                          <i class="fa fa-check"></i> Accept
                        </button>
                        <button
                          class="btn btn-outline-danger btn-sm"
                          (click)="handleStatus(user.id, 'reject')"
                        >
                          <i class="fa fa-ban"></i> Reject
                        </button>
                      </ng-container>
                       <ng-container *ngSwitchCase="'Rejected'">
                        <button
                          class="btn btn-outline-success btn-sm me-1"
                          (click)="handleStatus(user.id, 'accept')"
                        >
                          <i class="fa fa-check"></i> Accept
                        </button>
                        </ng-container>
                       <ng-container *ngSwitchCase="'Inactive'">
                        <button
                          class="btn btn-outline-success btn-sm me-1"
                          (click)="handleStatus(user.id, 'accept')"
                        >
                          <i class="fa fa-check"></i> Active
                        </button>
                        </ng-container>
                      <!-- Default/Other Statuses -->
                      <span *ngSwitchDefault class="text-muted"
                        >No Actions</span
                      >
                    </ng-container>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
