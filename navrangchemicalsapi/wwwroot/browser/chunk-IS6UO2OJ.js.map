

<form [formGroup]="companyForm" (ngSubmit)="onSubmit()" (ngSubmit)="onCancel()">
  <div class="card-body row" style="gap: 0">
    <!-- Product Name -->
    <div class="form-group row">
      <label for="userName" class="col-sm-3 col-form-label">
        <i class="fas fa-user"></i> Company Name
      </label>
      <div class="col-sm-7">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            id="userName"
            placeholder=""
            formControlName="companyName"
            readonly
          />
        </div>
      </div>
    </div>

    <div class="form-group row">
      <label for="mobileNo" class="col-sm-3 col-form-label">
        <i class="fas fa-sticky-note"></i> GSTIN No.
    </label>
    <div class="col-sm-7">
        <div class="input-group">
            <input
            class="form-control"
            id="mobileNo"
            placeholder="Enter GSTIN"
            formControlName="gstin"
          />
        </div>
    </div>

    </div>
    <div class="form-group row">
      <label for="email" class="col-sm-3 col-form-label">
        <i class="fas fa-envelope"></i> Address
      </label>
      <div class="col-sm-7">
        <div class="input-group">
          <textarea   
          class="form-control"
            placeholder="Enter Address"
            formControlName="companyAddress">
          </textarea>
        </div>
      </div>
    </div>
    
    
    <!-- catagory -->
    <div class="form-group  row align-items-start">
        <label for="userRoleId" class="col-sm-3 col-form-label">
        <i class="fas fa-user-tag"></i> Bank Account No.
      </label>
      <div class="col-sm-7">
        <input
          class="form-control select2"
          id="userRoleId"
          formControlName="accNo"
        />
      </div>
    </div>

    <!-- Company -->
    <div class="form-group row">
      <label for="companyId" class="col-sm-3 col-form-label">
        <i class="fas fa-building"></i> Branch Name
      </label>
      <div class="col-sm-7">
        <input
          class="form-control select2"
          id="companyId"
          formControlName="branchName"
        />
      </div>
    </div>

    <div class="form-group row">
      <label for="companyId" class="col-sm-3 col-form-label">
        <i class="fas fa-phone"></i> Phone No
      </label>
      <div class="col-sm-7">
        <input
          type="number"
          class="form-control select2"
          id="companyId"
          formControlName="phone"
        />
      </div>
    </div>
    <!-- Company -->
    <div class="form-group row">
      <label for="companyId" class="col-sm-3 col-form-label">
        <i class="fas fa-building"></i> IFSC
      </label>
      <div class="col-sm-7">
        <input
          class="form-control select2"
          id="companyId"
          formControlName="ifsc"
        />
      </div>
    </div>
    <div class="form-group row" style="visibility: hidden;">
      <label for="companyId" class="col-sm-3 col-form-label">
        <i class="fas fa-building"></i> IFSC
      </label>
      <div class="col-sm-7">
        <input
          class="form-control select2"
          id="companyId"
          formControlName="ifsc"
        />
      </div>
    </div>


    
  </div>

  <div class="card-footer d-flex justify-content-between align-items-center">
    <button type="submit" class="btn btn-info mb-0">
      <i class="fas fa-save"></i> Update Company
    </button>
    <button (click)="onCancel()" class="btn btn-danger ms-auto">
      <i class="fas fa-times"></i> Cancel
    </button>
  </div>
</form>
