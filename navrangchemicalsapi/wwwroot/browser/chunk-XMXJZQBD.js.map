<form [formGroup]="supplierForm" (ngSubmit)="onSubmit()">
  <div class="card-body row" style="gap: 25px; display: block">
    <!-- Party Name -->
    <div class="form-group row">
      <label class="col-sm-2 col-form-label">Party Name</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" formControlName="name" placeholder="Supplier Name" />
      </div>
    </div>

    <!-- Address -->
    <div class="form-group row">
      <label class="col-sm-2 col-form-label">Address</label>
      <div class="col-sm-10">
        <textarea class="form-control" formControlName="address" placeholder="Address"></textarea>
      </div>
    </div>

    <!-- GSTIN -->
    <div class="form-group row">
      <label class="col-sm-2 col-form-label">GSTIN No</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" formControlName="GSTIN" placeholder="GSTIN No" />
      </div>
    </div>

    <!-- State Code (readonly) -->
    <div class="form-group row">
      <label class="col-sm-2 col-form-label">State Code</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" [value]="supplierForm.get('stateCode')?.value" readonly />
      </div>
    </div>

    <!-- State Dropdown -->
    <div class="form-group row">
      <label class="col-sm-2 col-form-label">State</label>
      <div class="col-sm-10">
        <select class="form-control" [formControl]="stateControl" (change)="onStateChange($event)">
          <option *ngFor="let state of States" [value]="state.id">{{ state.name }}</option>
        </select>
      </div>
    </div>

        <div class="form-group row">
      <label class="col-sm-2 col-form-label">Phone</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" formControlName="phone" placeholder="Enter Phone" />
      </div>
    </div>
        <div class="form-group row">
      <label class="col-sm-2 col-form-label">Email</label>
      <div class="col-sm-10">
        <input type="email" class="form-control" formControlName="email" placeholder="Enter Email" />
      </div>
    </div>

    <div class="card-footer d-flex justify-content-between align-items-center mt-3">
      <button type="submit" class="btn btn-info"><i class="fas fa-save"></i> Save Supplier</button>
      <a routerLink="/supplier" class="btn btn-danger ms-auto"><i class="fas fa-times"></i> Cancel</a>
    </div>
  </div>
</form>
