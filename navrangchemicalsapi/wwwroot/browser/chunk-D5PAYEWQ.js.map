<section class="content">
  <div class="container-fluid">
    <!-- Finished Product Inward Form -->
    <div class="row">
      <div class="col-12">
        <div class="card border-info">
          <div class="card-header bg-info text-white">
            <h3 class="card-title mb-0">Finished Product Inward</h3>
          </div>
          <form [formGroup]="inwardForm" (ngSubmit)="saveInward()">
            <div class="card-body">
              <div class="row mb-3">
                <div class="col-md-3">
                  <label for="inwardDate" class="form-label">Inward Date</label>
                  <input
                    type="date"
                    class="form-control"
                    formControlName="inwardDate"
                    id="inwardDate"
                  />
                </div>
                <div class="col-md-3">
                  <label for="lotNo" class="form-label">Lot No</label>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="lotNo"
                    id="lotNo"
                  />
                </div>
                <div class="col-md-6">
                  <label for="productId" class="form-label"
                    >Finished Product</label
                  >
                  <select
                    class="form-select"
                    formControlName="productId"
                    id="productId"
                  >
                    <option value="0" disabled>Select Product</option>
                    <option
                      *ngFor="let product of products"
                      [value]="product.id"
                    >
                      {{ product.productName }}
                    </option>
                  </select>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-2">
                  <label for="bags" class="form-label">Bags</label>
                  <input
                    type="number"
                    class="form-control"
                    formControlName="bags"
                  />
                </div>
                <div class="col-md-2">
                  <label for="kgBags" class="form-label">Kg/Bags</label>
                  <input
                    type="number"
                    class="form-control"
                    formControlName="kgBags"
                  />
                </div>
                <div class="col-md-2">
                  <label for="grossQty" class="form-label">Gross Qty</label>
                  <input
                    type="number"
                    class="form-control"
                    formControlName="grossQty"
                  />
                </div>
              </div>
            </div>

            <!-- Semi-Finished Section -->
            <div class="card border-secondary mt-3">
              <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">Semi-Finished Products Used</h5>
              </div>
              <div class="card-body">
                <div
                  [formGroup]="semiFinishedForm"
                  class="row g-3 align-items-end"
                >
                  <div class="col-md-4">
                    <label>Semi-Finished Product</label>
                    <select
                      formControlName="semiFinishedId"
                      class="form-select"
                      (change)="onSemiFinishedChange()"
                    >
                      <option value="0" disabled>Select Semi-Finished</option>
                      <option
                        *ngFor="let sf of semiFinishedProducts"
                        [value]="sf.id"
                      >
                        {{ sf.name }}
                      </option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <label>Bags</label>
                    <input
                      type="number"
                      formControlName="bags"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-2">
                    <label>Kg/Bags</label>
                    <input
                      type="number"
                      formControlName="kgBags"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-2">
                    <label>Gross Qty</label>
                    <input
                      type="number"
                      formControlName="grossQty"
                      class="form-control"
                      readonly
                    />
                  </div>
                  <div class="col-md-2 d-grid">
                    <button
                      type="button"
                      class="btn btn-info mt-1"
                      (click)="addSFToList()"
                    >
                      Add
                    </button>
                  </div>
                </div>

                <!-- Stock Info -->
                <div class="row mt-3 g-3">
                  <div class="col-md-2">
                    <label class="form-label">Bag Stock</label>
                    <input
                      type="number"
                      class="form-control"
                      [value]="bagStock"
                      disabled
                    />
                  </div>
                  <div class="col-md-2">
                    <label class="form-label">Gross Qty Stock</label>
                    <input
                      type="number"
                      class="form-control"
                      [value]="grossQtyStock"
                      disabled
                    />
                  </div>
                </div>
              </div>
            </div>

            <!-- Semi-Finished Table -->
            <div class="card mt-3 border-light">
              <div class="card-body">
                <table class="table table-bordered table-hover">
                  <thead class="table-light">
                    <tr>
                      <th>#</th>
                      <th>Semi-Finished</th>
                      <th>Bags</th>
                      <th>Kg/Bags</th>
                      <th>Gross Qty</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let item of dataList; let i = index">
                      <td>{{ i + 1 }}</td>
                      <td>{{ item.semiFinishedName }}</td>
                      <td>{{ item.bags }}</td>
                      <td>{{ item.kgBags }}</td>
                      <td>{{ item.grossQty }}</td>
                      <td>
                        <button
                          type="button"
                          class="btn btn-sm btn-danger"
                          (click)="removeSFFromList(i)"
                        >
                          Remove
                        </button>
                      </td>
                    </tr>
                    <tr *ngIf="dataList.length === 0">
                      <td colspan="6" class="text-center text-muted">
                        No semi-finished products added
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Form Footer -->
            <div class="card-footer d-flex justify-content-between mt-3">
              <button type="submit" class="btn btn-success">Save Inward</button>
              <button
                type="button"
                class="btn btn-danger"
                routerLink="/semi-finished-inward"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
