<section class="content">
  <div class="container-fluid">
    <div class="card card-info">
      <div class="card-header">
        <h3 class="card-title">Add QC Standard Expiry</h3>
      </div>

      <form [formGroup]="qcForm" (ngSubmit)="save()">
        <div class="card-body">
          <!-- Product Dropdown -->
          <div class="form-group">
            <label class="col-form-label">Product</label>
            <select class="form-control" formControlName="productId">
              <option value="">-- Select Product --</option>
              <option *ngFor="let p of products" [value]="p.id">
                {{ p.productName }}
              </option>
            </select>
          </div>

          <!-- Preserving Date + Validity -->
          <div class="form-group row align-items-center" style=" flex-direction: row; align-items: center;">
            <!-- Preserving Date -->
            <div class="col-md-4">
              <label class="col-form-label">Standard Preserving Date</label>
              <input
                type="date"
                class="form-control"
                formControlName="preservingDate"
              />
            </div>

            <!-- Validity (Months) -->
            <div class="col-md-2">
              <label class="col-form-label">Validity (Months)</label>
              <input
                type="number"
                class="form-control"
                formControlName="validity"
                min="1"
              />
            </div>

            <!-- Expiry Date -->
            <div class="col-md-4">
              <label class="col-form-label">Expiry Date</label>
              <input
                type="text"
                class="form-control"
                [value]="expiryDate"
                disabled
              />
            </div>
          </div>

          <!-- Strength / DE / DA / DB / DC -->
          <div class="form-group">
            <label class="col-form-label">Strength</label>
            <input
              type="number"
              class="form-control"
              formControlName="strength"
            />
          </div>

          <div class="form-group">
            <label class="col-form-label">DE</label>
            <input type="number" class="form-control" formControlName="de" />
          </div>

          <div class="form-group">
            <label class="col-form-label">DA</label>
            <input type="number" class="form-control" formControlName="da" />
          </div>

          <div class="form-group">
            <label class="col-form-label">DB</label>
            <input type="number" class="form-control" formControlName="db" />
          </div>

          <div class="form-group">
            <label class="col-form-label">DC</label>
            <input type="number" class="form-control" formControlName="dc" />
          </div>
        </div>

        <div class="card-footer">
          <button
            type="submit"
            class="btn btn-info"
            [disabled]="qcForm.invalid"
          >
            Save
          </button>
          <a routerLink="/qc-standard-expiry" class="btn btn-danger">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</section>
