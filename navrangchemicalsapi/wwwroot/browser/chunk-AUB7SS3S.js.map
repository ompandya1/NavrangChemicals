
<form [formGroup]="makeForm" (ngSubmit)="onSubmit()" (ngSubmit)="onCancel()">
  <div class="card-body row" style="gap: 0">
    <div class="form-group row">
      <label for="userName" class="col-sm-3 col-form-label">
        <i class="fas fa-user"></i> Make Name
      </label>
      <div class="col-sm-9">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            id="userName"
            placeholder="Enter product name"
            formControlName="name"
          />
        </div>
      </div>
    </div>   
  </div>

  <div class="card-footer d-flex justify-content-between align-items-center">
    <button type="submit" class="btn btn-info mb-0">
      <i class="fas fa-save"></i> Update Make
    </button>
    <button (click)="onCancel()" class="btn btn-danger ms-auto">
      <i class="fas fa-times"></i> Cancel
    </button>
  </div>
</form>
