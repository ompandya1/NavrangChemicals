<div class="wrapper">
  <section class="content">
    <div class="container-fluid">
      <form [formGroup]="poForm" (ngSubmit)="savePO()">
        <!-- Invoice & Supplier Details Row -->
        <div class="row">
          <!-- Invoice Details -->
          <div class="col-md-6">
            <div class="card card-cyan">
              <div
                class="card-header d-flex justify-content-between align-items-center"
              >
                <h3 class="card-title">Invoice Details</h3>
                <div class="card-tools ms-auto">
                  <button
                    type="button"
                    class="btn btn-tool"
                    (click)="invoiceCollapsed = !invoiceCollapsed"
                  >
                    <i
                      class="fas"
                      [ngClass]="{
                        'fa-minus': !invoiceCollapsed,
                        'fa-plus': invoiceCollapsed
                      }"
                    ></i>
                  </button>
                </div>
              </div>
              <div
                class="card-body"
                [@collapseExpand]="invoiceCollapsed ? 'closed' : 'open'"
              >
                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label>Purchase Order Date:</label>
                      <input
                        type="text"
                        class="form-control"
                        formControlName="orderDate"
                        [disabled]="true"
                        readonly
                      />
                    </div>
                    <div class="form-group">
                      <label>Terms Of Delivery:</label>
                      <input
                        type="text"
                        class="form-control"
                        formControlName="termsOfDelivery"
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-group">
                      <label>Place Of Supply:</label>
                      <input
                        type="text"
                        class="form-control"
                        formControlName="placeOfSupply"
                      />
                    </div>
                    <div class="form-group">
                      <label>Terms Of Payment:</label>
                      <input
                        type="text"
                        class="form-control"
                        formControlName="termsOfPayment"
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Supplier Details -->
          <div class="col-md-6">
            <div class="card card-primary">
              <div
                class="card-header d-flex justify-content-between align-items-center"
              >
                <h3 class="card-title">Supplier Details</h3>
                <div class="card-tools ms-auto">
                  <button
                    type="button"
                    class="btn btn-tool"
                    (click)="supplierCollapsed = !supplierCollapsed"
                  >
                    <i
                      class="fas"
                      [ngClass]="{
                        'fa-minus': !invoiceCollapsed,
                        'fa-plus': invoiceCollapsed
                      }"
                    ></i>
                  </button>
                </div>
              </div>
              <div
                class="card-body"
                [@collapseExpand]="supplierCollapsed ? 'closed' : 'open'"
              >
                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label>M/s.:</label>
                      <select formControlName="supplierId" class="form-control" (change)="onSupplierChange($event)">
  <option value="">Select Supplier</option>
  <option *ngFor="let supplier of suppliers" [value]="supplier.id">{{ supplier.name }}</option>
</select>

                      <!-- 👇 hidden field outside the select -->
                      <input type="hidden" formControlName="supplierName" />
                    </div>
                    <div class="form-group">
                      <label>Address:</label>
                      <textarea
                        class="form-control"
                        formControlName="address"
                        [disabled]="true"
                      ></textarea>
                    </div>
                    <div class="form-group">
                      <label>Mobile No:</label>
                      <input
                        type="text"
                        class="form-control"
                        formControlName="mobileNo"
                        [disabled]="true"
                      />
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-group">
                      <label>GST No:</label>
                      <input
                        type="text"
                        class="form-control"
                        formControlName="gstNo"
                        [disabled]="true"
                      />
                    </div>
                    <div class="form-group">
                      <label>State:</label>
                      <input
                        type="text"
                        class="form-control"
                        formControlName="state"
                        [disabled]="true"
                      />
                    </div>
                    <div class="form-group">
                      <label>Email:</label>
                      <input
                        type="text"
                        class="form-control"
                        formControlName="email"
                        [disabled]="true"
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- PRODUCT Details -->
        <div class="col-md-6">
          <div class="card card-primary">
            <div
              class="card-header d-flex justify-content-between align-items-center"
            >
              <h3 class="card-title">Product</h3>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Select Product: </label>
                    <select
                      class="form-control"
                      [formControl]="selectedProductControl"
                    >
                      <option value="0">----Select Product----</option>
                      <option
                        *ngFor="let rm of rawMaterials"
                        [value]="rm.id"
                      >
                        {{ rm.name }}
                      </option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Product & Rates Row -->
        <div class="row">
          <div class="col-md-12">
            <div class="callout callout-info">
              <div class="row g-2">
                <div class="col-md-3">
                  <label>Select Make:</label>
                  <select
                    class="form-control"
                    [formControl]="selectedMakeControl"
                  >
                    <option value="0">----Select Make----</option>
                    <option *ngFor="let make of makes" [value]="make.name">
                      {{ make.name }}
                    </option>
                  </select>
                </div>

                <div class="col-md-2">
                  <label>Unit:</label>
                  <select
                    class="form-control"
                    [formControl]="selectedUnitControl"
                  >
                    <option value="1">Carton</option>
                    <option value="2">Kgs.</option>
                    <option value="3">Ltrs.</option>
                    <option value="4">Dram</option>
                  </select>
                </div>

                <div class="col-md-2">
                  <label>Rate:</label>
                  <input
                    type="number"
                    class="form-control"
                    [formControl]="rateControl"
                    placeholder="Rate"
                  />
                </div>

                <div class="col-md-2">
                  <label>Per:</label>
                  <input
                    type="number"
                    class="form-control"
                    [formControl]="perControl"
                    [disabled]="true"
                  />
                </div>

                <div class="col-md-2">
                  <label>Quantity:</label>
                  <input
                    type="number"
                    class="form-control"
                    [formControl]="quantityControl"
                  />
                </div>

                <div class="col-md-1 d-flex align-items-end">
                  <button class="btn btn-info w-100" (click)="addProduct()">
                    Add
                  </button>
                </div>
              </div>

              <!-- Amount Row -->
              <div class="row mt-2">
                <div class="col-md-2 offset-md-10">
                  <label>Amount:</label>
                  <input
                    type="number"
                    class="form-control"
                    [formControl]="amountControl"
                    [disabled]="true"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Product Table -->
        <div class="row">
          <div class="col-md-12">
            <div class="callout callout-info">
              <table class="table table-bordered table-hover">
                <thead>
                  <tr>
                    <th>Item No.</th>
                    <th>Product Name</th>
                    <th>Make</th>
                    <th>Quantity</th>
                    <th>Unit</th>
                    <th>Rate</th>
                    <th>Per</th>
                    <th>Amount</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody formArrayName="items">
                  <tr
                    *ngFor="let item of items.controls; let i = index"
                    [formGroupName]="i"
                  >
                    <td>{{ i + 1 }}</td>
                    <td>{{ item.value.rawMaterialName }}</td>
                    <td>{{ item.value.make }}</td>
                    <td>{{ item.value.quantity }}</td>
                    <td>{{ item.value.unit }}</td>
                    <td>{{ item.value.rate }}</td>
                    <td>{{ item.value.per }}</td>
                    <td>{{ item.get("amount")?.value }}</td>
                    <td>
                      <button
                        class="btn btn-outline-danger btn-xs"
                        (click)="removeProduct(i)"
                      >
                        <i class="fa fa-remove"></i> Remove
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>

              <!-- Grand Total -->
              <div class="row mt-2">
                <div class="col-md-3 offset-md-9">
                  <label>Grand Total:</label>
                  <input
                    type="number"
                    class="form-control"
                    [value]="grandTotal"
                    [disabled]="true"
                  />
                </div>
              </div>

              <!-- Buttons -->
              <div class="row mt-3">
                <div class="col-md-6">
                  <button class="btn btn-success submit" (click)="generatePDF()">
                    Generate
                  </button>
                </div>
                <div class="col-md-6 text-end">
                  <button
                    class="btn btn-danger"
                    (click)="router.navigate(['/purchase-orders'])"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </section>
</div>
