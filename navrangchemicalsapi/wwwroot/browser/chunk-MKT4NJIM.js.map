
<form [formGroup]="productForm" (ngSubmit)="onSubmit()" (ngSubmit)="onCancel()">
  <div class="card-body row" style="gap: 0">
    <!-- Product Name -->
    <div class="form-group row">
      <label for="userName" class="col-sm-3 col-form-label">
        <i class="fas fa-user"></i> Product Name
      </label>
      <div class="col-sm-7">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            id="userName"
            placeholder="Enter product name"
            formControlName="productName"
          />
        </div>
      </div>
    </div>

    <!-- HSN code -->
    <div class="form-group row">
      <label for="email" class="col-sm-3 col-form-label">
        <i class="fas fa-envelope"></i> HSN Code
      </label>
      <div class="col-sm-7">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            id="email"
            placeholder="Enter HSN code"
            formControlName="hsNcode"
          />
          
        </div>
      </div>
    </div>

    <!-- Product Price -->
    <div class="form-group row">
      <label for="mobileNo" class="col-sm-3 col-form-label">
        <i class="fas fa-phone"></i> Product Price
      </label>
      <div class="col-sm-7">
        <div class="input-group">
          <input
            type="number"
            class="form-control"
            id="mobileNo"
            placeholder="Enter Price"
            formControlName="productPrice"
          />
        </div>
      </div>
    </div>


     <!-- catagory -->
    <div class="form-group row">
      <label for="userRoleId" class="col-sm-3 col-form-label">
        <i class="fas fa-user-tag"></i> Product Catagory
      </label>
      <div class="col-sm-7">
        <select
          class="form-control select2"
          id="userRoleId"
          formControlName="catagoryName"
        >
          <option value="">Select Catagory</option>
          <option value="Yellow">Yellow</option>
          <option value="Orange">Orange</option>
          <option value="Golden">Golden</option>
          <option value="Red">Red</option>
          <option value="Magenta">Magenta</option>
          <option value="Blue">Blue</option>
          <option value="Black">Black</option>
          <option value="Matching">Matching</option>
          <option value="Scarlet">Scarlet</option>
        </select>
      </div>
    </div>

    <!-- Company -->
    <div class="form-group row">
      <label for="companyId" class="col-1-5 mx-0 col-form-label">
        <i class="fas fa-building"></i> Company 
      </label>
      <div class="col-sm-7">
        <select
          class="form-control select2"
          id="companyId"
          formControlName="companyName"
        >
          <option value="">Select Company</option>
          <option value="Navrang">Navrang</option>
          <option value="Navkar">Navkar</option>
          <option value="Navtex">Navtex</option>
        </select>
      </div>
    </div>

    
  </div>

  <div class="card-footer d-flex justify-content-between align-items-center">
    <button type="submit" class="btn btn-info mb-0">
      <i class="fas fa-save"></i> Update Product
    </button>
    <button (click)="onCancel()" class="btn btn-danger ms-auto">
      <i class="fas fa-times"></i> Cancel
    </button>
  </div>
</form>
