<div class="wrapper">
  <div class="main-content">
    <section class="content-header">
      <div class="container-fluid">
        <h3>Suppliers</h3>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">
        <div class="card">
          <div
            class="card-header d-flex justify-content-between align-items-center"
          >
            <h3 class="card-title mb-0">Details</h3>
            <button class="btn btn-primary ms-auto" routerLink="/add-supplier">
              Add a new Supplier
            </button>
          </div>

          <div class="card-body">
            <input
              type="text"
              class="form-control mb-3"
              placeholder="Search..."
              [(ngModel)]="searchTerm"
            />

            <table
              class="table table-bordered table-hover"
              style="text-align: center"
            >
              <thead>
                <tr>
                  <th>Sr.No.</th>
                  <th>Party Name</th>
                  <th>GSTIN</th>
                  <th>Address</th>
                  <th>State</th>
                  <th>StateCode</th>
                  <th>email</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let supplier of filteredSupplier(); let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ supplier.name }}</td>
                  <td>{{ supplier.gstin }}</td>
                  <td>{{ supplier.address }}</td>
                  <td>{{ supplier.state }}</td>
                  <td>{{ supplier.stateCode }}</td>
                  <td>{{ supplier.email }}</td>

                  <!-- Actions Column -->
                  <td>
                    <button
                          class="btn btn-outline-success btn-sm me-1"
                          [routerLink]="['/edit-supplier', supplier.id]"
                        >
                          <i class="fa fa-pencil-square"></i> Edit
                        </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
