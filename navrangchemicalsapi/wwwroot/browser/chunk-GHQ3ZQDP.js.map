<div class="wrapper">
  <div class="main-content">
    <section class="content-header">
      <div class="container-fluid">
        <h3>Dispatch List</h3>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">
        <div class="card">
          <div
            class="card-header d-flex justify-content-between align-items-center"
          >
            <h3 class="card-title mb-0">Details</h3>
          </div>

          <div class="card-body">
            <input
              type="text"
              class="form-control mb-3"
              placeholder="Search..."
              [(ngModel)]="searchTerm"
            />

            <table
              class="table table-bordered table-hover"
              style="text-align: center"
            >
              <thead>
                <tr>
                  <th>Sr.No.</th>
                  <th>Invoice No.</th>
                  <th>Customer Name</th>
                  <th>Mobile</th>
                  <th>Email</th>
                  <th>Order Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let user of filteredUsers(); let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ user.invoiceNo }} </td>
                  <td>{{ user.customerName }}</td>
                  <td>{{ user.customerPhone }}</td>
                  <td>{{ user.customerEmail }}</td>
                  <td>{{ user.orderDate | date : "short" }}</td>
             
                  <!-- Actions Column -->
                  <td>
                    <button
                          class="btn btn-outline-success btn-sm me-1"[routerLink]="['/order-details', user.invoiceNo]">
                          <i class="fa fa-eye"></i> Info
                        </button>
                    <button
                          class="btn btn-outline-success btn-sm me-1" (click)="generateInvoice(user.invoiceNo)">
                          <i class="fa fa-check"></i> Invoice
                        </button>
                    <button
                          class="btn btn-outline-success btn-sm me-1"  [routerLink]="['/edit-invoice', user.invoiceNo]">
                          <i class="fa fa-pencil-square"></i> Edit Invoice
                        </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
