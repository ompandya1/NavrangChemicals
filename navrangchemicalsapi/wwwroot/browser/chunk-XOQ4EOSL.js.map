<section class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card card-info">
          <div class="card-header">
            <h3 class="card-title">Product Details</h3>
          </div>

          <!-- Hidden Order ID -->
          <input type="text" [value]="orders?.id" hidden />

          <br />
          <div class="col-md-12">
            <div class="row">
              <div class="col-md-4">
                <div class="callout callout-info">
                  <label>
                    Dispatch No. :
                    <span><strong>{{ orders?.orderDispatch?.invoiceNo }}</strong></span>
                  </label>
                </div>
              </div>

              <div class="col-md-3">
                <div class="callout callout-info">
                  <label>
                    Dispatch Date. :
                    <span><strong>{{ orders?.invoiceDate | date: 'dd-MM-yyyy' }}</strong></span>
                  </label>
                </div>
              </div>

              <div class="col-md-3">
                <div class="callout callout-info">
                  <label>
                    Order Items. :
                    <span><strong>{{ orders?.items?.length }}</strong></span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="card-body">
            <table class="table table-bordered table-hover">
              <thead>
                <tr>
                  <th>Category Name</th>
                  <th>Product Name</th>
                  <th>Order Quantity</th>
                  <th>Dispatch Quantity</th>
                  <th>Packing Type</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let order of orders?.items">
                  <td>{{ order.product?.catagoryName }}</td>
                  <td>{{ order.product?.productName }}</td>
                  <td>{{ order.quantity }}KG</td>
                  <td>{{ order.kgs }} KG</td>
                  <td>{{ order.bagType }}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="card-footer">
            <button
              class="btn btn-success btn-flat btn-sm"
              routerLink="/dispatch-list"
            >
              <i class="fa fa-angle-left"> </i> Back
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
