<div class="wrapper">
  <div class="main-content">
    <section class="content-header">
      <div class="container-fluid">
        <h3>Semi Finished Inward</h3>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">
        <div class="card">
          <div
            class="card-header d-flex justify-content-between align-items-center"
          >
            <h3 class="card-title mb-0">Details</h3>
            <button class="btn btn-primary ms-auto" routerLink= "/add-semi-finished-inward">
             <i class="fa fa-plus"></i> Add a new Semi Finished Inward
            </button>
          </div>

          <div class="card-body">
            <input
              type="text"
              class="form-control mb-3"
              placeholder="Search..."
              [(ngModel)]="searchTerm"
            />

            <table
              class="table table-bordered table-hover"
              style="text-align: center"
            >
              <thead>
                <tr>
                  <th>Sr.No.</th>
                  <th>Batch No.</th>
                  <th>SemiFinished Name</th>
                  <th>Inward Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let r of FilteredInwards(); let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ r.batchNo }}</td>
                  <td>{{ r.semiFinished?.name }}</td>
                  <td>{{ r.inwardDate | date : "short" }}</td>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
