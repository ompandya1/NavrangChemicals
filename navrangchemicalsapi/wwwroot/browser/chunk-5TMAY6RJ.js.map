<div class="wrapper">
  <section class="content">
    <div class="container-fluid">
      <form [formGroup]="invoiceForm">

        <!-- =================== INVOICE DETAILS =================== -->
        <div class="row">
          <div class="col-md-6">
            <div class="card card-cyan">
              <div class="card-header">
                <h3 class="card-title">Invoice Details</h3>
              </div>
              <div class="card-body">
                <div class="row g-2">
                  <div class="col-md-6">
                    <label>Invoice Date</label>
                    <input type="date" formControlName="invoiceDate" class="form-control"/>
                  </div>
                  <div class="col-md-6">
                    <label>Challan Date</label>
                    <input type="date" formControlName="challanDate" class="form-control"/>
                  </div>
                  <div class="col-md-6">
                    <label>Place of Supply</label>
                    <input type="text" formControlName="placeOfSupply" class="form-control"/>
                  </div>
                  <div class="col-md-6">
                    <label>Vehicle No</label>
                    <input type="text" formControlName="vehicleNo" class="form-control"/>
                  </div>
                  <div class="col-md-6">
                    <label>Transportation</label>
                    <input type="text" formControlName="transportation" class="form-control"/>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- =================== PARTY DETAILS =================== -->
          <div class="col-md-6">
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Party Details</h3>
              </div>
              <div class="card-body">
                <div class="row g-2">
                  <div class="col-md-6">
                    <label>M/s.</label>
                    <select formControlName="partyId" class="form-control">
                      <option value="">--Select Party--</option>
                      <option *ngFor="let p of parties" [value]="p.id">{{p.name}}</option>
                    </select>
                    <label>GST No</label>
                    <input type="text" [value]="selectedParty?.gstin" class="form-control" disabled/>
                  </div>
                  <div class="col-md-6">
                    <label>Mobile No</label>
                    <input type="text" [value]="selectedParty?.phone" class="form-control" disabled/>
                    <label>State</label>
                    <input type="text" [value]="selectedParty?.state + ' - ' + selectedParty?.stateCode" class="form-control" disabled/>
                  </div>
                  <div class="col-md-12">
                    <label>Address</label>
                    <textarea [value]="selectedParty?.address" class="form-control" rows="2" disabled></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- =================== PRODUCT FORM =================== -->
        <div class="card card-info mt-3">
          <div class="card-header"><h3 class="card-title">Add Product</h3></div>
          <div class="card-body">
            <div class="row g-2" [formGroup]="productForm">

              <div class="col-md-3">
                <label>Select Product</label>
                <select formControlName="productId" class="form-control" (change)="onProductChange()">
                  <option value="">--Select Product--</option>
                  <option *ngFor="let p of products" [value]="p.id">{{p.productName}}</option>
                </select>
              </div>

              <div class="col-md-2">
                <label>Rate Type</label>
                <select formControlName="rateType" class="form-control">
                  <option *ngFor="let r of rateTypes; let i=index" [value]="i">{{r}}</option>
                </select>
              </div>

              <div class="col-md-1">
                <label>Pack</label>
                <input type="number" formControlName="pack" class="form-control" (input)="calculateItemAmount()"/>
              </div>

              <div class="col-md-1">
                <label>Kgs/Pack</label>
                <input type="number" formControlName="kgs" class="form-control" (input)="calculateItemAmount()"/>
              </div>

              <div class="col-md-1">
                <label>Rate</label>
                <input type="number" formControlName="rate" class="form-control" (input)="calculateItemAmount()"/>
              </div>

              <div class="col-md-1">
                <label>Quantity</label>
                <input type="number" formControlName="quantity" class="form-control"/>
              </div>

              <div class="col-md-2">
                <label>Amount</label>
                <input type="number" formControlName="amount" class="form-control" />
              </div>

              <div class="col-md-1 d-flex align-items-end">
                <button type="button" class="btn btn-success w-100" (click)="addItem()">Add</button>
              </div>

            </div>
          </div>
        </div>

        <!-- =================== DISPATCH TABLE =================== -->
        <div class="card mt-3">
          <div class="card-header"><h3 class="card-title">Dispatch List</h3></div>
          <div class="card-body table-responsive">
            <table class="table table-bordered table-hover">
              <thead>
                <tr>
                  <th>#</th><th>Name</th><th>HSN</th><th>BagType</th>
                  <th>Pack</th><th>Kgs</th><th>Qty</th><th>Rate</th>
                  <th>Per</th><th>Amount</th><th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of dispatchList; let i=index">
                  <td>{{i+1}}</td>
                  <td>{{item.description}}</td>
                  <td>{{item.hsnCode}}</td>
                  <td>{{item.bagType}}</td>
                  <td>{{item.pack}}</td>
                  <td>{{item.kgs}}</td>
                  <td>{{item.quantity}}</td>
                  <td>{{item.rate}}</td>
                  <td>{{item.per}}</td>
                  <td>{{item.amount | number:'1.2-2'}}</td>
                  <td><button class="btn btn-danger btn-xs" (click)="removeItem(i)">Remove</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- =================== TOTALS =================== -->
<div class="row mt-3 g-2">
  <!-- Basic Amount -->
  <div class="col-md-3">
    <label>Basic Amount</label>
    <input type="number" class="form-control" [value]="basicAmount | number:'1.2-2'" disabled/>
  </div>

  <!-- Discount (%) -->
  <div class="col-md-3">
    <label>Discount (%)</label>
    <input type="number" formControlName="discountPer" class="form-control"/>
  </div>

  <!-- Discount Cash -->
  <div class="col-md-3">
    <label>Discount Cash</label>
    <input type="number" class="form-control" [value]="discountCash | number:'1.2-2'" disabled/>
  </div>

  <!-- Total Taxable -->
  <div class="col-md-3">
    <label>Total Taxable Value</label>
    <input type="number" class="form-control" [value]="totalTaxable | number:'1.2-2'" disabled/>
  </div>

  <!-- CGST -->
  <div class="col-md-3 mt-2">
    <label>CGST (%)</label>
    <div class="input-group">
      
      <input type="number" formControlName="cgstPer" class="form-control" (input)="calculateTotals()"/>
     
    </div>
  </div>

  <div class="col-md-3 mt-2">
    <label>CGST Amount</label>
  <input type="number" formControlName="cgstAmt" class="form-control" readonly/>
  </div>

  <!-- SGST -->
  <div class="col-md-3 mt-2">
    <label>SGST (%)</label>
    <div class="input-group">
      
      <input type="number" formControlName="sgstPer" class="form-control" (input)="calculateTotals()"/>
   
    </div>
  </div>

  <div class="col-md-3 mt-2">
    <label>SGST Amount</label>
    <input type="number" formControlName="sgstAmt" class="form-control" readonly/>
  </div>

  <!-- Round Off -->
  <div class="col-md-3 mt-2">
    <label>Round Off</label>
    <input type="number" class="form-control" [value]="roundOff | number:'1.2-2'" disabled/>
  </div>

  <!-- Grand Total -->
  <div class="col-md-3 mt-2">
    <label>Grand Total</label>
    <input type="number" class="form-control" [value]="grandTotal | number:'1.2-2'" disabled/>
  </div>
</div>

        <!-- =================== BUTTONS =================== -->
        <div class="mt-3 d-flex justify-content-between">
          <button type="button" class="btn btn-success" (click)="saveInvoice()">Generate Invoice</button>
          <button type="button" class="btn btn-danger" (click)="cancel()">Cancel</button>
        </div>

      </form>
    </div>
  </section>
</div>
